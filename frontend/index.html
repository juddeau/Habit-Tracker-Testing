<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker — трекер привычек</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decor"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">🔥</span>
        <div>
          <h1>Habit Tracker</h1>
          <p class="subtitle">Маленькие шаги каждый день</p>
        </div>
      </div>
      <button class="btn btn-primary" id="openCreateBtn">
        <span>+</span> Новая привычка
      </button>
    </header>

    <section class="stats-row" id="statsRow">
      <div class="stat-card">
        <span class="stat-value" id="statHabits">0</span>
        <span class="stat-label">Привычек</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statDoneToday">0</span>
        <span class="stat-label">Сделано сегодня</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statBestStreak">0</span>
        <span class="stat-label">Лучший стрик</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="statTotalCheckins">0</span>
        <span class="stat-label">Всего отметок</span>
      </div>
    </section>

    <main>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-emoji">🌱</div>
        <h2>Пока нет привычек</h2>
        <p>Добавьте первую привычку, чтобы начать отслеживать прогресс</p>
        <button class="btn btn-primary" id="emptyCreateBtn">+ Добавить привычку</button>
      </div>

      <div id="habitsGrid" class="habits-grid"></div>
    </main>
  </div>

  <!-- Модалка создания / редактирования -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Новая привычка</h2>

      <label class="field">
        <span>Название</span>
        <input type="text" id="habitNameInput" placeholder="Например: Пить воду" maxlength="80" />
      </label>

      <label class="field">
        <span>Иконка</span>
        <div class="icon-picker" id="iconPicker"></div>
      </label>

      <label class="field">
        <span>Цвет</span>
        <div class="color-picker" id="colorPicker"></div>
      </label>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn">Отмена</button>
        <button class="btn btn-primary" id="saveHabitBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
